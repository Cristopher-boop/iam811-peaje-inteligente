<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso Denegado — Control de Peaje</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-rose-500/40 rounded-2xl p-8 text-center">
    <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-2xl font-bold">!</div>
    <h1 class="text-2xl font-bold text-white mb-2">Acceso Denegado</h1>
    <p class="text-slate-300 text-sm mb-3">
      La cuenta <code class="px-2 py-0.5 bg-slate-800 rounded text-rose-300">{{ email or 'desconocida' }}</code> no está autorizada para ingresar al sistema.
    </p>
    <p class="text-slate-400 text-xs mb-6">{{ motivo }}</p>
    <a href="/login" class="inline-block px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold text-white">
      Volver al inicio de sesión
    </a>
  </div>
</body>
</html>
